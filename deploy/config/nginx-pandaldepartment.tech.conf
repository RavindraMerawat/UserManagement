# =============================================================================
#  pandaldepartment.tech
#
#  Install:  sudo cp /opt/pandal/config/nginx-pandaldepartment.tech.conf \
#                    /etc/nginx/sites-available/pandaldepartment.tech
#            sudo ln -s /etc/nginx/sites-available/pandaldepartment.tech \
#                       /etc/nginx/sites-enabled/
#            sudo rm -f /etc/nginx/sites-enabled/default
#            sudo nginx -t && sudo systemctl reload nginx
#
#  This is the HTTP-only version, which is what you need to get certbot working.
#  Running certbot (README step 8) rewrites this file to add HTTPS and to send
#  http:// traffic to https://. Nothing below needs editing by hand for that.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name pandaldepartment.tech www.pandaldepartment.tech;

    # The built browser app - plain files, nothing to execute.
    root /var/www/pandaldepartment.tech;
    index index.html;

    # A photo may be a few megabytes, and the app accepts up to 15MB. nginx
    # defaults to 1MB and would reject the upload itself with a 413 before the
    # app ever saw it, which looks like a broken Save button.
    client_max_body_size 20m;

    access_log /var/log/nginx/pandaldepartment.access.log;
    error_log  /var/log/nginx/pandaldepartment.error.log;

    # ---- the API, handled by the Java app on the loopback interface ----
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A monthly report over a large register can take a while to build.
        proxy_connect_timeout 30s;
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
    }

    # The API docs, if you want them reachable. Comment this block out to keep
    # them off the public internet.
    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # ---- the browser app ----
    # Hashed filenames, so they can be cached hard and for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: /attendance and /reports are routes inside the page, not
    # files on disk. Without this, refreshing on one of them returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or a browser keeps loading the old
    # page after a deploy and asks for asset files that are no longer there.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
