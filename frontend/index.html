<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the page paint under an iPhone's rounded corners and
      home indicator; the CSS then keeps content clear of them with env(safe-area-*).
      maximum-scale is deliberately NOT set: pinch zoom is an accessibility feature
      and locking it out is the wrong way to stop iOS zooming on a focused input -
      16px form fields are, and that is what the stylesheet does.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12314f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pandal Office Management" />
    <meta name="format-detection" content="telephone=no" />
    <title>Pandal Office Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
