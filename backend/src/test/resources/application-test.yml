spring:
  datasource:
    url: jdbc:h2:mem:umstest;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  # The tests run on H2 and build their schema from the entities, so the MySQL
  # script is not used here. That also keeps the entity mapping under test in its
  # own right rather than only ever being checked against the script.
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 3025

app:
  jwt:
    secret: test-secret-key-for-unit-tests-only-0123456789abcdef
    expiration-minutes: 60
    issuer: sewa-ums
  bootstrap:
    enabled: false
  notification:
    email:
      enabled: false
    whatsapp:
      enabled: false

logging:
  level:
    org.hibernate.SQL: WARN
